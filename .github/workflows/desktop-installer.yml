# 데스크톱 설치 파일을 만듭니다.
#
# jpackage는 크로스 빌드를 못 합니다 — Windows .exe는 Windows에서만, macOS .dmg는
# macOS에서만 만들어집니다. 그래서 Windows 장비 없이 .exe를 얻으려면 이 워크플로가
# 필요합니다.
#
# 실행: GitHub → Actions → "데스크톱 설치 파일" → Run workflow
#       (자동 실행은 하지 않습니다. 태그를 붙일 때만 함께 돕니다.)
name: 데스크톱 설치 파일

on:
  workflow_dispatch:
    inputs:
      version:
        description: '설치 파일 버전 (예: 1.0.0). 첫 자리는 0이 될 수 없습니다.'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            # exe/msi 생성은 WiX Toolset 3.x(candle.exe/light.exe)에 의존한다.
            needs_wix: true
          - os: macos-latest
            label: macos
            needs_wix: false

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      # 앱을 컴파일한 툴체인과 같은 메이저 버전을 쓴다. jpackage는 자신이 속한 JDK의
      # 런타임을 앱에 함께 넣으므로, 여기서 21을 벗어나면 검증하지 않은 런타임 위에서
      # 도는 설치 파일이 만들어진다.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install WiX Toolset
        if: matrix.needs_wix
        shell: pwsh
        run: |
          # 러너 이미지에 이미 들어 있으면 PATH에만 추가한다. 없으면 설치한다.
          $bin = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset*' -Directory -ErrorAction SilentlyContinue |
                 Sort-Object Name -Descending |
                 ForEach-Object { Join-Path $_.FullName 'bin' } |
                 Where-Object { Test-Path (Join-Path $_ 'candle.exe') } |
                 Select-Object -First 1

          if (-not $bin) {
            choco install wixtoolset --version=3.11.2 -y --no-progress
            $bin = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset*' -Directory |
                   Sort-Object Name -Descending |
                   ForEach-Object { Join-Path $_.FullName 'bin' } |
                   Where-Object { Test-Path (Join-Path $_ 'candle.exe') } |
                   Select-Object -First 1
          }

          if (-not $bin) { throw 'WiX Toolset의 candle.exe를 찾지 못했습니다.' }
          Write-Host "WiX bin: $bin"
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      # 스크립트는 하나만 유지한다. Windows 러너에는 Git Bash가 들어 있어 같은 bash
      # 스크립트를 그대로 쓸 수 있고, PowerShell로 로직을 복제하면 두 벌을 관리해야 한다.
      - name: Build installer
        shell: bash
        env:
          # 수동 실행은 입력값을, 태그 푸시는 태그 이름에서 v를 떼어 쓴다.
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${VERSION_INPUT:-}" ]]; then
            export APP_VERSION="$VERSION_INPUT"
          else
            export APP_VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "APP_VERSION=$APP_VERSION"
          packaging/desktop/jpackage/build-desktop.sh

      - name: List output
        shell: bash
        run: ls -lh packaging/desktop/jpackage/dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ProjectFlow-installer-${{ matrix.label }}
          path: packaging/desktop/jpackage/dist/*
          if-no-files-found: error
          retention-days: 14
