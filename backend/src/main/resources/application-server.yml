# 서버 배포 프로필: 컨테이너 환경 변수로 PostgreSQL에 접속합니다.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:projectflow}
    username: ${DB_USERNAME:projectflow}
    password: ${DB_PASSWORD:projectflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# 프론트엔드를 백엔드와 다른 오리진에서 서비스할 때 지정한다 (쉼표 구분).
# 기본값은 지금 이 배포의 프론트엔드 주소다. 와일드카드가 아니라 하나의 정확한 오리진이므로,
# 다른 곳에 배포하면 그 주소로 덮어써야 한다 — 안 덮으면 그 배포에서는 교차 오리진이 막힌다
# (막히는 편이 조용히 아무 오리진이나 허용하는 것보다 낫다).
# 예: CORS_ALLOWED_ORIGINS=https://project-flow.example.com
# 여러 개면 쉼표로: CORS_ALLOWED_ORIGINS=https://a.example.com,https://b.example.com

project-flow:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://192.168.60.70:5151}
