# 데스크톱 배포 프로필: 설치 없이 로컬 파일 기반 H2로 바로 동작합니다.
spring:
  datasource:
    url: jdbc:h2:file:${user.home}/.project-flow/data/project-flow;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

# 개발 중에는 Vite 개발 서버가 프론트엔드를 서비스하고, 5173이 점유되어 있으면 Vite가 다른 포트로
# 올린다. 포트를 하나로 고정하면 그 순간부터 화면의 쓰기 동작이 전부 403이 된다 (GET에는 Origin
# 헤더가 없어 통과하므로 "화면은 뜨는데 저장만 안 되는" 형태로 나타난다).
# jpackage로 묶은 데스크톱 앱에서는 프론트엔드가 백엔드 정적 리소스로 함께 들어가 같은 오리진이
# 되므로 이 설정이 쓰이지 않는다.
#
# 루프백 패턴은 "내 PC에서 연다"만 덮는다. 다른 기기에서 LAN 주소로 열면 브라우저가 보내는 Origin은
# 예를 들어 http://192.168.60.70:5151 이고, Vite 프록시는 Host만 바꾸고 Origin은 그대로 넘기므로
# (changeOrigin) 백엔드는 이 값을 그대로 본다 — 루프백만 허용해 두면 같은 "저장만 403" 증상이 난다.
# 그렇다고 IP 하나를 여기 박아 두면 DHCP로 주소가 바뀌거나 다른 기기·인터페이스에서 접속하는 순간
# 또 막힌다(포트를 하나로 고정하지 않는 것과 같은 이유) — 그래서 사설 대역(192.168.*.*, 10.*.*.*)
# 전체를 허용한다. 172.16.0.0/12(172.16~172.31, 주로 Docker 브리지)는 정확히 덮으려면 패턴 16줄이
# 필요해 설정이 읽기 어려워지고 실제로 쓰이는 경우도 드물어 일부러 넣지 않았다. https:// 도 넣지
# 않았다 — LAN 개발/호스팅은 보통 http이고 TLS를 앞에 둔다면 별도로 지정해야 한다. 호스트명 접속
# (예: http://mypc:5151)도 패턴으로 덮으려면 http://*:[*] 가 되어 사실상 전부 허용이라 넣지 않았다.
# 이 세 가지가 필요해지면 아래 CORS_ALLOWED_ORIGINS 로 덮는다.
#
# *로 아무 오리진이나 허용하지 않는 이유: 그러면 사용자가 악성 웹사이트를 여는 것만으로 그 사이트의
# 스크립트가 http://localhost:8081/api/... 에 DELETE 같은 요청을 보낼 수 있다 — 브라우저가 막아
# 주던 것을 우리가 열어 주는 셈이다. 루프백·사설 대역으로 좁혀 둔 이유가 그것이고, 공인 IP·외부
# 도메인은 계속 403이어야 한다.
#
# 끝의 ${CORS_ALLOWED_ORIGINS:} 는 비어 있으면 마지막에 빈 문자열 조각을 만들지만, WebConfig 가
# .filter(pattern -> !pattern.isEmpty()) 로 걸러내므로 안전하다 — 쉼표가 남는다고 지우지 말 것.
project-flow:
  cors:
    allowed-origin-patterns: "http://localhost:[*],http://127.0.0.1:[*],http://192.168.*.*:[*],http://10.*.*.*:[*],${CORS_ALLOWED_ORIGINS:}"
