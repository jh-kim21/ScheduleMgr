spring:
  application:
    name: project-flow
  profiles:
    active: desktop
  servlet:
    multipart:
      # WBS 가져오기(Excel/CSV)뿐인 유일한 업로드 경로. 기본 1MB로는 스타일이 많은 실제 엑셀 파일을
      # 튕겨낼 수 있어 여유 있게 둔다.
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

project-flow:
  commit:
    # 프로젝트별 커밋 히스토리 저장 한도(바이트). 초과 시 커밋이 409로 거부된다
    # (docs/tasks/commit-history.md §4.4). 기본 1GB, 서버 배포에서 조정 가능하도록 하드코딩하지 않는다.
    max-bytes-per-project: 1073741824

logging:
  level:
    com.projectflow: INFO
