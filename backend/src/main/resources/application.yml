spring:
  application:
    name: project-flow
  profiles:
    active: desktop
  servlet:
    multipart:
      # WBS 가져오기(Excel/CSV)뿐인 유일한 업로드 경로. 기본 1MB로는 스타일이 많은 실제 엑셀 파일을
      # 튕겨낼 수 있어 여유 있게 둔다.
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

logging:
  level:
    com.projectflow: INFO
